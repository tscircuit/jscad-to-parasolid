# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main
      - '!version-bumps/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skip test for PRs that not chore: bump version
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'chore: bump version' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Setup Python for independent Parasolid validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/validation/requirements.txt

      - name: Install native validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/validation/requirements.txt

      - name: Run tests
        run: bun test

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots
          include-hidden-files: true
          path: |
            tests/**/__snapshots__/*.diff.png
            tests/**/__snapshots__/*.actual.png
            artifacts/
            tests/visual/.artifacts/
          if-no-files-found: ignore
